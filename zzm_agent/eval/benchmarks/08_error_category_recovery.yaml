name: "error_category_recovery"
description: "错误分类恢复：文件不存在时返回环境错误，模型随后换用搜索工具"
task: "请找到 missing.py 里 target 的位置"
initial_files: {}
replay_turns:
  - tool_calls:
      - name: "read_file"
        arguments:
          path: "missing.py"
  - tool_calls:
      - name: "grep_search"
        arguments:
          pattern: "target"
  - content: "已通过搜索找到 target：src/real.py:10。"
mock_tool_results:
  - name: "read_file"
    arguments:
      path: "missing.py"
    exception: "FileNotFoundError"
    message: "missing.py"
  - name: "grep_search"
    arguments:
      pattern: "target"
    result: "src/real.py:10: target"
expected:
  expected_tool_calls:
    - "read_file"
    - "grep_search"
  forbidden_tool_calls:
    - "run_shell"
  output_match: "src/real.py:10"
  model_call_count: 3
  reflection_count: 0
  tool_call_sequence:
    - name: "read_file"
      arguments:
        path: "missing.py"
    - name: "grep_search"
      arguments:
        pattern: "target"
  tool_result_json_contains:
    - error_type: "FileNotFoundError"
      category: "environment"
      deterministic: true
      retryable: false
      attempts: 1
