name: "code_reading"
description: "代码阅读：给定文件，回答函数职责"
task: "请阅读 example.py 并告诉我 compute_sum 函数是做什么的？"
initial_files:
  "example.py": |
    def compute_sum(a, b):
        """Return the sum of a and b."""
        return a + b
replay_turns:
  - tool_calls:
      - name: "read_file"
        arguments:
          path: "example.py"
  - content: "这个函数负责计算两个数 a 和 b 的和。"
mock_tool_results:
  - name: "read_file"
    arguments:
      path: "example.py"
    result: "def compute_sum(a, b):\n    \"\"\"Return the sum of a and b.\"\"\"\n    return a + b\n"
expected:
  expected_tool_calls:
    - "read_file"
  forbidden_tool_calls:
    - "file_edit"
    - "run_shell"
  output_match: "计算"
