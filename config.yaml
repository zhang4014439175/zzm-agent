model:
  # 你可以通过 .env 文件覆盖这三个核心配置，这里设定了默认的回退值(:-后面部分)
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  model_name: "${LLM_MODEL_NAME}"
  temperature: 0.7
  max_tokens: 4096
  # Optional explicit model context window. If omitted, OpenRouter models are
  # discovered from /models; otherwise memory.max_context_tokens is used.
  context_window_tokens:
  # Optional pricing for CLI cost estimates, in USD per 1M tokens.
  input_price_per_1m: 0
  output_price_per_1m: 0

agent:
  system_prompt: "你是 zzm-agent，一个简洁高效的个人助理，请用中文进行对话。"
  auto_approve: false
  max_tool_iterations: 20
  duplicate_tool_call_limit: 3
  max_tool_retries: 1
  # Empty content without tool calls is retried, then reported as blocked.
  empty_final_retries: 2
  # Store larger tool outputs as Artifacts and send a compact source-linked view.
  max_inline_tool_result_tokens: 2000
  # Safety fuse for repeated internal segments; exhaustion is reported as blocked.
  max_auto_continuations: 8
  stream: true
  # Set to null if the current provider rejects tool_choice.
  tool_choice: "auto"
  plugin_dirs:
    - "zzm_agent/plugins"

ui:
  # auto 会优先跟随本轮显式要求、输入语言、会话语言和系统 locale。
  response_language: "auto"
  # 当 auto 无法判断时使用的默认语言。
  default_locale_language: "zh-CN"

memory:
  path: ".zzm_agent/memory.json"
  max_history: 50
  retrieval_top_k: 3
  max_context_tokens: 32000
  compression_keep_recent: 10
  # 智能体指令文件列表（按照列表顺序以及从根目录到当前目录的层级依次加载，后者优先级更高）
  instruction_files:
    - "AGENTS.md"  # 团队/项目级公共指令文件（通常会被提交到 Git 控制中共享）
    - "ZZM.md"     # 个人/本地特有覆盖指令文件（通常会被添加到 .gitignore 中忽略）
  # 每个指令文件的最大加载字符数上限，超出部分将被自动截断以节省模型 Token 消耗
  instruction_max_chars: 8000
  auto_memory_enabled: true

evolution:
  enabled: false
  trigger: "manual"
  sample_size: 20
  history_versions: 5
  # 预留配置，当前版本不承诺启用
  auto_interval:
  threshold:
