model:
  # 你可以通过 .env 文件覆盖这三个核心配置，这里设定了默认的回退值(:-后面部分)
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  model_name: "${LLM_MODEL_NAME}"
  temperature: 0.7
  max_tokens: 4096
  # Optional explicit model context window. If omitted, OpenRouter models are
  # discovered from /models; otherwise memory.max_context_tokens is used.
  context_window_tokens:
  # Optional pricing for CLI cost estimates, in USD per 1M tokens.
  input_price_per_1m: 0
  output_price_per_1m: 0

agent:
  system_prompt: "你是 zzm-agent，一个简洁高效的个人助理。"
  auto_approve: false
  max_tool_iterations: 20
  duplicate_tool_call_limit: 3
  max_tool_retries: 1
  plugin_dirs:
    - "zzm_agent/plugins"

memory:
  path: ".zzm_agent/memory.json"
  max_history: 50
  retrieval_top_k: 3
  max_context_tokens: 32000
  compression_keep_recent: 10

evolution:
  enabled: false
  trigger: "manual"
  sample_size: 20
  history_versions: 5
  # 预留配置，当前版本不承诺启用
  auto_interval:
  threshold:
